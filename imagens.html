<!DOCTYPE html>
<html lang="pt--BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animes</title>
</head>


<style>
    .img-pequena {
        width: 30%;
        height: 150px;
        object-fit: cover;
    }
    .img-destaque{
        height: 300px;
        width: 100%;
        object-fit: cover;
    }
    img {
        border-radius: 30px;
        border: 10px dashed black;
    }

    .div-images{
        margin-top: 30px;
        border: 2px rgb(78, 73, 69);
        display: flex;
        justify-content: space-between;
    }

    body {
        background-color:rgb(173, 163, 163);
    }

</style>

<body>
    <div>
        <img class="img-destaque" src="F1.webp" alt="naruto">
    </div>

    <div class="div-images">
        <img class="img-pequena" src="F2.webp" alt="death note">
        <img class="img-pequena" src="F3.webp" alt="attack on titan">
        <img class="img-pequena" src="F4.jpg" alt="hunter hunter">
    </div>
    
</body>
</html>
