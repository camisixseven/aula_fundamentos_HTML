<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camila — Portfolio</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    /* Reset & Variáveis de Cores */
    * { 
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-color: #f7f1e5;        /* Creme solar */
      --card-bg: #fffcf7;         /* Linho / Marfim */
      --text-main: #2c2523;       /* Marrom café bem escuro */
      --accent-terracotta: #c86d51;/* Terracota italiano */
      --accent-olive: #5b6e4d;     /* Verde oliva */
      --border-color: #e4d5c7;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .card {
      background-color: var(--card-bg);
      padding: 40px 30px;
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      text-align: center;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(91, 74, 61, 0.08);
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--accent-terracotta);
      margin-bottom: 15px;
    }

    h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-style: italic;
      color: var(--accent-olive);
      margin: 25px 0 10px 0;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 5px;
      display: inline-block;
    }

    p {
      font-size: 0.95rem;
      color: #665a55;
      margin-bottom: 10px;
      font-weight: 300;
    }

    .profile-img {
      width: 160px;
      height: 160px;
      object-fit: cover;
      border-radius: 50%;
      margin: 15px 0;
      border: 3px solid var(--bg-color);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    ul {
      list-style-type: none;
      margin-top: 5px;
    }

    li {
      padding: 6px 0;
      font-size: 0.95rem;
    }

    li a {
      text-decoration: none;
      color: var(--text-main);
      transition: color 0.3s ease;
      font-weight: 400;
    }

    li a:hover {
      color: var(--accent-terracotta);
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }

    .social-links a {
      display: inline-block;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .social-links a:hover {
      transform: translateY(-3px);
      opacity: 0.8;
    }

    .logos {
      width: 28px;
      height: 28px;
      filter: grayscale(30%); /* Dá um toque levemente vintage */
    }
  </style>
</head>

<body>

  <main class="card">
    <h1>Olá, meu nome é Camila</h1>
    
    <img src="foto.png" alt="Foto de Camila" class="profile-img">
    
    <p>Faço Dev • 16 anos</p>

    <h2>Hobbies</h2>
    <ul>
      <li><a href="https://youtube.com/playlist?list=PLbk4ada2yiP8&si=78wHQLOXfvnmF8ee" target="_blank" rel="noopener noreferrer">Cozinhar</a></li>
      <li><a href="https://youtube.com/playlist?list=PLNdKbFkdX5m4&si=wm9EyeqiTmTwu4eJ" target="_blank" rel="noopener noreferrer">Comer</a></li>
      <li><a href="https://youtube.com/playlist?list=PLNy1MmmEA2gk&si=hu-uHILPc9vIBvOV" target="_blank" rel="noopener noreferrer">Ouvir música</a></li>
    </ul>

    <h2>Receitas favoritas</h2>
    <ul>
      <li>Brownie</li>
      <li>Cookie</li>
      <li>Parmegiana</li>
      <li>Strogonoff</li>
    </ul>

    <div class="social-links">
      <a href="https://github.com/camisixseven/aula_fundamentos_HTML.git" target="_blank" rel="noopener noreferrer">
        <img class="logos" src="github.png" alt="GitHub">
      </a>
      
      <a href="#" target="_blank" rel="noopener noreferrer">
        <img class="logos" src="linkedin.png" alt="LinkedIn">
      </a>

    </div>
  </main>

</body>
</html>
